<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Articles Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">View Articles</h2>

    <div class="row mb-3">
      <div class="col-md-4">
        <label for="dateInput" class="form-label">Select Date</label>
        <input type="date" id="dateInput" class="form-control">
      </div>
      <div class="col-md-4">
        <label for="sourceSelect" class="form-label">Source (optional)</label>
        <select id="sourceSelect" class="form-select">
          <option value="">All Sources</option>
          <!-- Dynamically populate if needed -->
        </select>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-primary w-100" id="loadBtn">Load Articles</button>
      </div>
    </div>

    <table class="table table-bordered mt-3" id="articlesTable">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Author</th>
          <th>Date</th>
          <th>Source</th>
          <th>Summary</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody>
        <!-- Article rows -->
      </tbody>
    </table>

    <nav>
      <ul class="pagination" id="pagination">
        <!-- Pagination buttons -->
      </ul>
    </nav>
  </div>

  <script>
    const limit = 10;
    let currentPage = 1;
  
    function loadArticles(page = 1) {
      const date = $('#dateInput').val();
      const sourceId = $('#sourceSelect').val();
  
      if (!date) {
        alert("Please select a date.");
        return;
      }
  
      const params = {
        date: date,
        page: page,
        limit: limit
      };
      if (sourceId) params.source_id = sourceId;
  
      $.get('/articles', params, function (res) {
        const { data, meta } = res;
        const tbody = $('#articlesTable tbody');
        const pagination = $('#pagination');
  
        tbody.empty();
        pagination.empty();
  
        if (!data.length) {
          tbody.append('<tr><td colspan="6" class="text-center">No articles found.</td></tr>');
        } else {
          data.forEach(article => {
            tbody.append(`
              <tr>
                <td>${article.id}</td>
                <td>${article.author || '-'}</td>
                <td>${new Date(article.date).toLocaleDateString()}</td>
                <td>${article.source || '-'}</td>
                <td>${article.summary || '-'}</td>
                <td><a href="${article.url}" target="_blank">View</a></td>
              </tr>
            `);
          });
        }
  
        // Pagination
        for (let i = 1; i <= meta.pages; i++) {
          const active = i === meta.page ? 'active' : '';
          pagination.append(`
            <li class="page-item ${active}">
              <a class="page-link" href="#" onclick="loadArticles(${i})">${i}</a>
            </li>
          `);
        }
  
        currentPage = meta.page;
      });
    }
  
    $('#loadBtn').on('click', function () {
      loadArticles(1);
    });
  
    $('#dateInput').on('change', function () {
      loadArticles(1); // 🔁 reload articles on date change
    });
  
    $(document).ready(function () {
      const today = new Date().toISOString().split('T')[0];
      $('#dateInput').val(today);
      loadArticles(1); // 🔁 load on page load
    });
  </script>
  
</body>
</html>
